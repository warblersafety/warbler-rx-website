<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Warbler Health sharing card</title>
  <!-- Source for public/assets/warbler-share-retention-v1.png. Render at 1200 × 630, device scale 1, after fonts load. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Geist:wght@400;600&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #fff; color: #0a0a0a; font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
    main { position: absolute; inset: 24px; border: 1px solid #ecece7; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 64px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 36px; font-weight: 600; letter-spacing: -.02em; }
    .brand img { display: block; width: 88px; height: 88px; object-fit: contain; }
    h1 { margin: 0; text-align: center; font-weight: 400; font-size: 76px; line-height: 1.12; letter-spacing: -.045em; }
    h1 span { display: block; white-space: nowrap; }
    h1 em { display: block; font-family: 'Instrument Serif', serif; font-size: 112px; font-weight: 400; line-height: 1.08; letter-spacing: -.02em; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="../public/assets/warbler-logo.png" alt=""><span>Warbler Health</span></div>
    <h1><span>Help more patients stay in</span><em>opioid treatment.</em></h1>
  </main>
</body>
</html>
